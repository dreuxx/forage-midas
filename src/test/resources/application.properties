# Puerto donde se levantará tu aplicación Spring Boot
server.port=33400

# Kafka settings
spring.kafka.consumer.group-id=midas
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.bootstrap-servers=localhost:29092

# El tópico donde escucha TransactionListener
general.kafka-topic=transactions

# Configuración del datasource H2 (Base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:midasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración para RestTemplate (por si es necesario)
spring.main.allow-bean-definition-overriding=true

# Logging opcional para ver mejor en consola
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG